name: Build B860 One-KVM Firmware

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      burn_tag: ${{ steps.check.outputs.burn_tag }}
      onekvm_tag: ${{ steps.check.outputs.onekvm_tag }}
      fingerprint: ${{ steps.check.outputs.fingerprint }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BURN_TAG=$(gh api repos/wuhao1477/b860av1-t-armbian-burn-builder/releases \
            --jq '[.[] | select(.prerelease and (.tag_name | startswith("b860-burn-")))] | first | .tag_name')
          ONEKVM_TAG=$(gh api repos/mofeng-git/One-KVM/releases/latest --jq .tag_name)
          FINGERPRINT=$(printf '%s\n%s' "$BURN_TAG" "$ONEKVM_TAG" | sha256sum | awk '{print $1}')

          PREV=$(gh api repos/${{ github.repository }}/releases --jq '[.[] | select(.body | contains("'"$FINGERPRINT"'"))] | length')

          echo "burn_tag=$BURN_TAG" >> $GITHUB_OUTPUT
          echo "onekvm_tag=$ONEKVM_TAG" >> $GITHUB_OUTPUT
          echo "fingerprint=$FINGERPRINT" >> $GITHUB_OUTPUT
          echo "should_build=$([[ "$PREV" -eq 0 ]] && echo true || echo false)" >> $GITHUB_OUTPUT

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils kpartx android-sdk-libsparse-utils qemu-user-static binfmt-support

      - name: Download and build ampack
        run: |
          mkdir -p .tools/bin
          git clone https://github.com/7Ji/ampart.git .tools/ampart-src
          cd .tools/ampart-src
          git checkout 71a7ca46fa75c31e3eef4895f0e90c77a815e9aa
          cargo build --release
          install -m 0755 target/release/ampack ../../.tools/bin/ampack
          cd ../..
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"

      - name: Download base burn.img
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ needs.check.outputs.burn_tag }}" \
            --repo wuhao1477/b860av1-t-armbian-burn-builder \
            --pattern 'burn.img.xz' \
            --dir dl/
          xz -d dl/burn.img.xz

      - name: Download One-KVM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ needs.check.outputs.onekvm_tag }}" \
            --repo mofeng-git/One-KVM \
            --pattern '*_arm64.deb' \
            --dir dl/

      - name: Integrate One-KVM
        run: |
          mkdir -p mnt out
          .tools/bin/ampack unpack dl/burn.img work/
          simg2img work/data.PARTITION work/data.img
          sudo losetup -f --show work/data.img > loop.txt
          LOOP=$(cat loop.txt)
          sudo mount $LOOP mnt/
          sudo cp /usr/bin/qemu-aarch64-static mnt/usr/bin/
          sudo cp dl/*.deb mnt/tmp/
          sudo chroot mnt/ bash -c 'dpkg -i /tmp/*.deb && systemctl enable one-kvm'
          sudo chroot mnt/ bash -c 'usermod -aG video root'
          echo 'KERNEL=="hidraw*", GROUP="input", MODE="0660"' | sudo tee mnt/etc/udev/rules.d/99-hidraw.rules
          sudo rm mnt/usr/bin/qemu-aarch64-static
          sudo umount mnt/
          sudo losetup -d $LOOP
          img2simg work/data.img work/data.PARTITION
          rm work/data.img
          .tools/bin/ampack pack --verify work/ out/burn.img
          cd out && xz -9 -T0 burn.img && sha256sum burn.img.xz > SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="onekvm-${{ needs.check.outputs.onekvm_tag }}-base-${{ needs.check.outputs.burn_tag }}"
          BODY="One-KVM ${{ needs.check.outputs.onekvm_tag }} + Base ${{ needs.check.outputs.burn_tag }}

          Input fingerprint: ${{ needs.check.outputs.fingerprint }}"

          gh release create "$TAG" out/burn.img.xz out/SHA256SUMS \
            --repo ${{ github.repository }} \
            --title "B860 One-KVM $TAG" \
            --notes "$BODY"
